[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slop-test"
dynamic = ["version"]
description = "Assertion-free testing. Your tests pass when they feel like they passed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "slopstack labs" }]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "tree-sitter>=0.25",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-dart>=0.1.0",
    "tree-sitter-elixir>=0.3.5",
    "tree-sitter-fsharp>=0.3.12",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-haskell>=0.24.1",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-julia>=0.23.1",
    "tree-sitter-kotlin>=1.1.0",
    "tree-sitter-lua>=0.5.0",
    "tree-sitter-ocaml>=0.26.0",
    "tree-sitter-php>=0.25.1",
    "tree-sitter-ruby>=0.23.1",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-scala>=0.26.2",
    "tree-sitter-swift>=0.7.4",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-zig>=1.1.2",
]
classifiers = [
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/slopstack-labs/slop-test"

[project.scripts]
slop-test = "slop_test.cli:app"

[project.entry-points.pytest11]
slop_test = "slop_test.pytest_plugin"

[tool.hatch.version]
path = "src/slop_test/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/slop_test"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
