[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slop-test"
dynamic = ["version"]
description = "Assertion-free testing. Your tests pass when they feel like they passed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "slopstack labs" }]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
]
classifiers = [
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/slopstack-labs/slop-test"

[project.scripts]
slop-test = "slop_test.cli:app"

[tool.hatch.version]
path = "src/slop_test/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/slop_test"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
